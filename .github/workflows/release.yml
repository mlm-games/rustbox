name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@main # pin to SHA in release branches
    with:
      working-directory: .
      app-slug: rustbox
      system-deps-linux: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      include-web: true
      include-android: true
      include-universal: true
      itch-username: mlm-games
      itch-game: rustbox
    secrets: inherit
