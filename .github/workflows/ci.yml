name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: mlm-games/ci/.github/workflows/rust-app-ci.yml@main # pin to SHA in release branches
    with:
      system-deps-linux: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      run-clippy: false
      run-fmt: true
      run-test: true
      extra-checks: |
        --target wasm32-unknown-unknown --no-default-features
      include-android: true
      upload-artifacts: true
      app-slug: rustbox
