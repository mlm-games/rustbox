[package]
name = "rustbox"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"
description = "3D Mario Maker–style builder on Bevy + Repose UI"
repository = "https://github.com/mlm-games/rustbox"
readme = "README.md"
keywords = ["bevy", "gamedev", "3d", "mario-maker", "repose", "level-editor"]
categories = ["game-development"]
rust-version = "1.98"
default-run = "rustbox-desktop"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustbox-desktop"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
# rustbox-worker is a wasm32-only Cloudflare Worker with its own workspace,
# hence it must be excluded from the glob (built standalone with --target wasm32).
exclude = ["crates/rustbox-worker"]

[features]
default = ["dev_native"]
dev = []
dev_native = ["dev"]

[dependencies]
repame-sim = "0.3"
repame-shell = "0.3"
repame-view3d = "0.3"
bevy_ecs = "0.19"
repose-core = "0.31"
repose-ui = "0.31"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
directories = "6"
anyhow = "1"
glam = "0.33"
web-time = "1"
rustbox-format = { path = "crates/rustbox-format" }
rustbox-voxel = { path = "crates/rustbox-voxel" }
rustbox-mesh = { path = "crates/rustbox-mesh" }
rustbox-physics = { path = "crates/rustbox-physics" }
ehttp = { version = "0.7", features = ["multipart", "json"] }
crossbeam-channel = "0.5"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
getrandom = "0.4"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = [
    "wasm_js",
], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[patch.crates-io]
repame-view3d = { path = "../repame/crates/repame-view3d" }
