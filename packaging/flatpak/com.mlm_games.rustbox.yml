id: com.mlm-games.rustbox
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: rustbox-desktop
modules:
  - name: rustbox
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/rustbox-desktop /app/bin/rustbox-desktop
    sources:
      - type: dir
        path: .
