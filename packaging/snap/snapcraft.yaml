name: rustbox
version: '0.2.0'
summary: 3D level builder
description: |
  A 3D Mario Maker–style builder with blocks, logic, and sharing.
grade: stable
confinement: strict

apps:
  rustbox-desktop:
    command: rustbox-desktop
    plugs: [x11, wayland, audio, joystick]

parts:
  rustbox-desktop:
    plugin: rust
    source: .
